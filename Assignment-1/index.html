<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Event Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎯 Smart Event Dashboard</h1>
    </header>

    <div class="dashboard-container">
        <div class="main-row">
            <section class="glass-card form-section">
                <h2>Add New Event</h2>
                <form id="eventForm">
                    <label>Event Title:</label>
                    <input type="text" id="eventTitle" placeholder="Enter title..." required>
                    
                    <label>Event Date:</label>
                    <input type="date" id="eventDate" required>

                    <label>Category:</label>
                    <select id="eventCategory">
                        <option value="Workshop">Workshop</option>
                        <option value="Conference">Conference</option>
                        <option value="Social">Social</option>
                    </select>

                    <label>Description:</label>
                    <textarea id="eventDescription" placeholder="Details..."></textarea>

                    <button type="submit" class="btn btn-primary">Add Event</button>
                </form>
            </section>

            <section class="glass-card events-display">
                <div class="display-header">
                    <h2>My Events</h2>
                    <div class="action-btns">
                        <button id="clearAllBtn" class="btn btn-clear">Clear All Events</button>
                        <button id="addSampleBtn" class="btn btn-sample">Add Sample Events</button>
                    </div>
                </div>
                <div id="eventContainer">
                    <div id="empty-state" class="empty-state">No events yet. Add your first event!</div>
                </div>
            </section>
        </div>

        <section class="glass-card demo-section">
            <h2>DOM Manipulation Demo</h2>
            <div class="demo-inner">
                <h3>innerText vs innerHTML vs textContent</h3>
                <div id="demoContent" class="demo-box">
                    <p>Waiting for key press...</p>
                </div>
                <p class="key-status">You pressed: <span id="keyPressed">None</span></p>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
